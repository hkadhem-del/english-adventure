<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرة الإنجليزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, encouraging — a kid's game console for the Top Goal 1 book
   IDEA: an island map; each unit is an island with stars to collect
   PICTURE: the game board itself — big tappable cards, pictures, letters
   COLOUR and TYPE: book teal + pink accent + sunny yellow; Baloo Bhaijaan 2
   LAYOUT: one column, big targets, works on a phone first */
:root{color-scheme:light dark;--bg:light-dark(#f3fbf8,#0d2522);--card:light-dark(#fff,#16332f);--ink:light-dark(#10322d,#e8f6f2);--soft:light-dark(#5c7a75,#9cbcb6);--teal:#0f8a7a;--pink:#e8197d;--sun:#ffc928;--ok:#1fa45a;--bad:#e0453a;--line:light-dark(#d6ebe6,#25504a);--emo:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Baloo Bhaijaan 2",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.en{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,14px) 40px}
header.top{background:var(--teal);color:#fff;padding:22px max(4vw,14px) 64px;position:relative;overflow:hidden}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px}
header.top h1{margin:0;font-size:clamp(30px,6vw,44px);line-height:1.05;font-weight:800}
header.top p{margin:4px 0 0;opacity:.9}
.wave{position:absolute;inset:auto 0 -1px 0;height:46px;width:100%}
.mascot{width:86px;height:86px;flex:none}
.total{margin-inline-start:auto;background:#fff2;border-radius:999px;padding:6px 14px;font-weight:800;display:flex;gap:6px;align-items:center;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px;margin-top:-34px;position:relative}
.unit,.rcard{background:var(--card);border-radius:22px;padding:0 0 14px;text-align:start;display:flex;flex-direction:column;gap:8px;overflow:hidden;box-shadow:0 6px 0 var(--line),0 10px 24px #0f8a7a1a;transition:transform .15s}
.unit:hover{transform:translateY(-3px)}
.rcard{box-shadow:0 6px 0 var(--line)}.thumb{position:relative;display:block;aspect-ratio:2.4/1;width:100%}.thumb svg,.hero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.num{position:absolute;top:10px;inset-inline-start:10px;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;color:#fff;font-weight:800;border:4px solid var(--card)}
.ut{display:flex;flex-direction:column;padding:4px 16px 0}.ut b.en{text-align:right}.ut small{color:var(--soft)}.unit .bar{margin:0 16px}.rcard .stars{margin-top:4px}
.hero{position:relative;aspect-ratio:2.6/1;border-radius:24px;overflow:hidden;margin-bottom:14px;box-shadow:0 6px 0 var(--line)}.hero.in{aspect-ratio:2.2/1;margin:0 0 12px;box-shadow:none;border-radius:18px}
.emo{font-family:var(--emo)}
.unit b,.rcard b{font-size:20px;line-height:1.15}.unit small{color:var(--soft)}
.stars{display:flex;gap:2px}.stars svg{width:16px;height:16px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--sun)}
.sub{display:flex;align-items:center;gap:12px;padding:16px 0}
.back{width:48px;height:48px;border-radius:16px;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 0 var(--line);flex:none}
.back svg{width:24px;height:24px}
.sub h2{margin:0;font-size:clamp(24px,5vw,32px);line-height:1.1}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.game{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;gap:14px;align-items:center;text-align:start;box-shadow:0 5px 0 var(--line);min-height:84px}
.game .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}
.game .ic svg{width:30px;height:30px}
.game b{display:block;font-size:19px;line-height:1.15}.game small{color:var(--soft);display:block;line-height:1.3}
.game .stars{margin-top:3px}
.play{background:var(--card);border-radius:26px;padding:clamp(16px,4vw,28px);box-shadow:0 6px 0 var(--line);text-align:center}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}.prog .bar{flex:1;height:12px}
.prog span{font-weight:800;color:var(--soft);white-space:nowrap}
.ask{font-size:18px;color:var(--soft);margin:0 0 8px}
.pic,.opt .e,.fc .pic{font-family:var(--emo)}
.pic{font-size:clamp(64px,16vw,96px);line-height:1.1;margin:6px 0}
.big{font-size:clamp(30px,8vw,46px);font-weight:800;line-height:1.1;margin:4px 0 10px}
.ar{font-size:22px;color:var(--soft)}
.spk{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border-radius:999px;padding:10px 20px;font-weight:800;min-height:48px;box-shadow:0 4px 0 #0a5f54;margin:4px}
.spk.alt{background:var(--sun);color:#3d2c00;box-shadow:0 4px 0 #c99a10}.spk.pk{background:var(--pink);box-shadow:0 4px 0 #a5105a}
.spk svg{width:22px;height:22px}
.spk:active,.opt:active,.tile:active{transform:translateY(3px);box-shadow:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.opt{background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:12px 8px;min-height:72px;font-size:21px;font-weight:600;box-shadow:0 4px 0 var(--line);line-height:1.2}
.opt .e{font-size:44px;display:block;line-height:1.15}
.opt.right{border-color:var(--ok);background:#1fa45a22}.opt.wrong{border-color:var(--bad);background:#e0453a1f;animation:shake .35s}
.opts.one{grid-template-columns:minmax(0,1fr)}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slots,.tiles,.line{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:ltr;margin:14px 0}
.slot{width:46px;height:56px;border-radius:12px;border:3px dashed var(--line);display:grid;place-items:center;font-size:28px;font-weight:800}
.slot.f{border-style:solid;border-color:var(--teal);background:#0f8a7a14}
.tile{min-width:50px;height:56px;padding:0 14px;border-radius:14px;background:var(--sun);color:#3d2c00;font-size:26px;font-weight:800;box-shadow:0 4px 0 #c99a10}
.tile.w{font-size:21px;background:#ffe9a6}
.tile.used{visibility:hidden}
.line{min-height:70px;border-bottom:3px solid var(--line);padding-bottom:10px;align-items:center}
.line .tile{background:var(--teal);color:#fff;box-shadow:0 4px 0 #0a5f54}
.line.wrong{animation:shake .35s}
.gq{font-size:clamp(22px,5.4vw,30px);font-weight:600;direction:ltr;line-height:1.35;margin:10px 0}
.gq u{text-decoration:none;display:inline-block;min-width:80px;border-bottom:3px solid var(--pink);color:var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.toast{min-height:34px;font-weight:800;font-size:22px;margin-top:12px}
.toast.ok{color:var(--ok)}.toast.no{color:var(--bad)}
.flash{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;direction:ltr}
.fc{flex:0 0 min(80%,300px);scroll-snap-align:center;background:var(--bg);border:3px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.fc .w{font-size:30px;font-weight:800;line-height:1.1}.fc .a{font-size:20px;color:var(--soft);direction:rtl}
.end{padding:10px 0}.end .stars{justify-content:center;gap:8px;margin:12px 0}.end .stars svg{width:56px;height:56px}
.end h3{font-size:32px;margin:0}
.rule{text-align:start}
.tag{display:inline-block;background:#2a3f8f;color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:15px}
.rule h3{font-size:clamp(24px,5.5vw,32px);line-height:1.15;margin:10px 0 6px;color:#2a3f8f}
:root[data-theme=dark] .rule h3{color:#9fb4ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .rule h3{color:#9fb4ff}}
.exp{font-size:19px;line-height:1.7;margin:0 0 14px;background:var(--bg);border-radius:18px;padding:14px 16px}
.exs{display:grid;gap:10px;margin:8px 0 14px}
.ex{display:flex;align-items:center;gap:12px;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-size:21px;font-weight:600;text-align:left;direction:ltr;box-shadow:0 4px 0 var(--line);min-height:56px}
.ex .pl{width:38px;height:38px;border-radius:50%;background:#2a3f8f;color:#fff;display:grid;place-items:center;flex:none}.ex .pl svg{width:18px;height:18px}
.ex.done{border-color:var(--ok)}.ex.done .pl{background:var(--ok)}
mark{background:#ffc92866;color:inherit;border-radius:6px;padding:0 4px;font-weight:800;border-bottom:3px solid var(--sun)}
.tip{background:#e8197d14;border:2px dashed var(--pink);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:18px}

.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.gloss{min-height:52px;margin:14px 0 6px;border-radius:16px;background:var(--bg);padding:10px 14px;color:var(--soft);font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.gloss.has{color:var(--ink);background:#ffc92833;border:2px solid var(--sun)}.gloss b{font-size:24px}
.story{direction:ltr;text-align:left;background:var(--bg);border-radius:20px;padding:12px 14px;margin:8px 0 16px}
.sn{margin:0;padding:8px 6px;border-radius:12px;font-size:clamp(20px,4.8vw,24px);line-height:1.8;transition:background .2s}
.sn.on{background:#ffc92855}
.sp{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:inline-grid;place-items:center;vertical-align:-4px;margin-right:8px}.sp svg{width:15px;height:15px}
.wd{cursor:pointer;border-radius:6px;padding:0 1px}.wd:hover{background:#0f8a7a22}.wd.sel{background:var(--sun);color:#3d2c00}
.peek{text-align:start;background:var(--bg);border-radius:14px;padding:8px 14px;margin-bottom:10px}.peek summary{cursor:pointer;font-weight:800;color:var(--teal)}.peek p{text-align:left;font-size:17px}
#qs .stars{display:inline-flex;vertical-align:-3px}
.again{display:inline-block;background:#e8197d18;color:var(--pink);border-radius:999px;padding:2px 14px;font-weight:800;font-size:15px;margin:0 0 8px}.again.test{background:#c27c0018;color:#c27c00}
.score{width:150px;height:150px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--line) 0)}.score span{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:38px;font-weight:800}
.mist{display:grid;gap:8px;text-align:start}.mist div{background:var(--bg);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;border-inline-start:5px solid var(--bad)}.mist b{color:var(--ok)}
.game[data-g=test]{background:linear-gradient(135deg,light-dark(#fff3cf,#3a3010),var(--card));border:2px solid #ffc928}
.note{color:var(--soft);font-size:14px;text-align:center;margin-top:22px}
@media(max-width:600px){.opt .e{font-size:38px}.slot{width:38px;height:50px;font-size:24px}.tile{height:52px;font-size:23px}.mascot{width:64px;height:64px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* game engine */
let R=null;
function start(u,k,x){
  const W=u.W;let items;
  if(k==='learn')return learn(u);
  if(k==='read')return u.reads.length>1?readList(u):readView(u,0);
  if(k==='rules'){items=[];u.rules.forEach((r,ri)=>{items.push({type:'rule',r,ri});sh(r.chk).forEach(c=>items.push({type:'chk',s:c,r}))})}
  if(k==='readq')items=u.reads[x].q.map(x=>({type:'q',s:x}));
  if(k==='listen')items=sh(W).slice(0,8);
  if(k==='match')items=sh(sh(W).slice(0,5).flatMap(w=>[{k:'match',t:w,dir:'e2a'},{k:'match',t:w,dir:'a2e'}]));
  if(k==='review')items=buildReview(u);
  if(k==='test')items=buildTest(u);
  if(k==='spell')items=sh(W.filter(w=>/^[a-z]{3,11}$/i.test(w.en))).slice(0,6);
  if(k==='say')items=sh(W).slice(0,6);
  if(k==='build')items=sh(u.sent);
  if(k==='gram')items=sh(u.gram);
  R={u,k,rx:x,gk:k==='readq'?'read':k,sk:k==='readq'?'read'+x:k,items,i:0,first:0,tried:false,n:items.filter(x=>x.type!=='rule').length,review:k==='review',test:k==='test',wrongs:[]};
  round();
}
function shell(inner){
  const g=G.find(x=>x.k===R.gk);
  app.innerHTML=`<div class="wrap"><div class="sub"><button class="back" aria-label="رجوع">${ICON.back}</button><div><h2>${g.ar}</h2><small style="color:var(--soft)">${R.u.ar} · مهارة: ${g.sk}</small></div></div>
  <div class="play"><div class="prog"><span class="en">${R.i+1}/${R.items.length}</span><span class="bar"><i style="width:${R.i/R.items.length*100}%;background:${g.c}"></i></span></div>${R.cur&&R.cur.again?'<p class="again">سؤال تكرّر لأنك أخطأت فيه — ركّز جيداً</p>':''}${R.test?'<p class="again test">اختبار: محاولة واحدة لكل سؤال</p>':''}${inner}<div class="toast" id="toast"></div></div></div>`;
  app.querySelector('.back').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}unit(R.u)};
}
const toast=(ok,t)=>{const e=$('#toast');e.className='toast '+(ok?'ok':'no');e.textContent=t};
function good(speak){
  if(R.fin===R.i)return;R.fin=R.i;
  if(!R.tried){if(!(R.cur&&R.cur.again))R.first++;weak(R.key,-1)}
  beep(true);toast(true,praise());
  if(speak)setTimeout(()=>say(speak),250);
  setTimeout(next,speak&&speak.length>14?2300:1400);
}
function bad(){
  if(R.fin===R.i)return;
  if(!R.tried){weak(R.key,2);if(R.review&&R.cur&&!R.cur.again){const c=Object.assign({},R.items[R.i],{again:true});if(!c.k)c.k=R.k;R.items.splice(Math.min(R.items.length,R.i+3),0,c)}}
  R.tried=true;beep(false);
  if(R.test){R.fin=R.i;R.lock=true;R.wrongs.push({q:R.qtext,a:R.ans});app.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===R.optAns)b.classList.add('right')});toast(false,'الإجابة الصحيحة: '+R.ans);setTimeout(next,2600);return}
  toast(false,'حاول مرة أخرى')}
function weak(key,d){if(!key)return;const p=P[R.u.id]=P[R.u.id]||{},w=p.wk=p.wk||{};w[key]=Math.max(0,Math.min(5,(w[key]||0)+d));if(!w[key])delete w[key];save()}
const weakN=u=>Object.keys((P[u.id]&&P[u.id].wk)||{}).length;
function setMeta(k,t,dir,it){
  R.cur={k,again:!!(it&&it.again)};R.key=null;R.rev=dir?dir==='a2e':R.i%2===1;
  if(['listen','match','spell','say'].includes(k)){R.key='w:'+t.en;R.optAns=t.en;R.ans=t.en;R.qtext=k==='listen'?'استماع: '+t.p:k==='spell'?'اكتب: '+t.ar:t.ar;
    if(k==='match'&&!R.rev){R.ans=t.ar;R.qtext=t.en}}
  if(k==='build'){R.key='s:'+t;R.ans=t;R.qtext='رتّب الجملة'}
  const bq=x=>{const [q,...o]=x.split('|');R.optAns=o[0];R.ans=q.includes('___')?q.replace('___',o[0]):o[0];R.qtext=q;return q};
  if(k==='gram')R.key='g:'+bq(t);
  if(t&&t.type==='chk')R.key='r:'+bq(t.s);
  if(t&&t.type==='q')R.key='q:'+bq(t.s);
}
function pool(u){
  const A=[];
  u.W.forEach(w=>{A.push({k:'match',t:w,dir:'e2a'},{k:'match',t:w,dir:'a2e'},{k:'listen',t:w});if(/^[a-z]{3,11}$/i.test(w.en))A.push({k:'spell',t:w})});
  u.sent.forEach(x=>A.push({k:'build',t:x}));
  u.gram.forEach(x=>A.push({k:'gram',t:x}));
  u.rules.forEach(r=>r.chk.forEach(c=>A.push({k:'rules',t:{type:'chk',s:c,r}})));
  u.reads.forEach((rd,rx)=>rd.q.forEach(q=>A.push({k:'readq',t:{type:'q',s:q,rx}})));
  return A;
}
const keyOf=it=>{const t=it.t;return it.k==='build'?'s:'+t:it.k==='gram'?'g:'+t.split('|')[0]:t.type?(t.type==='chk'?'r:':'q:')+t.s.split('|')[0]:'w:'+t.en};
function buildReview(u){
  const wk=(P[u.id]&&P[u.id].wk)||{},cnt={},out=[];
  const sc=sh(pool(u)).map(it=>({it,v:(wk[keyOf(it)]||0)*3+Math.random()*2})).sort((a,b)=>b.v-a.v);
  for(const {it} of sc){const kk=keyOf(it);if((cnt[kk]||0)>=2)continue;cnt[kk]=(cnt[kk]||0)+1;out.push(it);if(out.length>=12)break}
  return sh(out);
}
function buildTest(u){
  const A=pool(u),pick=(f,n)=>sh(A.filter(f)).slice(0,n);
  return sh([...pick(x=>x.k==='listen',3),...pick(x=>x.dir==='e2a',2),...pick(x=>x.dir==='a2e',2),...pick(x=>x.k==='spell',2),...pick(x=>x.k==='build',2),...pick(x=>x.k==='gram',2),...pick(x=>x.k==='rules',2),...pick(x=>x.k==='readq',2)]);
}
function next(){R.i++;R.tried=false;R.lock=false;if(R.i>=R.items.length)return end();round()}
function wrongs(t,n){return sh(R.u.W.filter(w=>w.en!==t.en&&w.p!==t.p)).slice(0,n)}

function round(){
  const it=R.items[R.i];let k=R.k,t=it,dir=null;
  if(it&&it.k){k=it.k;t=it.t;dir=it.dir}
  setMeta(k,t,dir,it);
  if(k==='rules'||k==='readq')return lessonRound(t);
  if(k==='listen'){
    const opts=sh([t,...wrongs(t,3)]);
    shell(`<p class="ask">اسمع جيداً، ثم اختر الصورة الصحيحة</p><button class="spk" id="s1">${ICON.spk} اسمع</button><button class="spk alt" id="s2">ببطء</button>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o.en)}"><span class="e">${o.p}</span><span class="en">${o.en}</span></button>`).join('')}</div>`);
    $('#s1').onclick=()=>say(t.en);$('#s2').onclick=()=>say(t.en,1);
    setTimeout(()=>say(t.en),300);
    bindOpts(t.en,null);
  }
  if(k==='match'){
    const rev=R.rev,opts=sh([t,...wrongs(t,3)]);
    shell(rev?`<p class="ask">ما الكلمة الإنجليزية لهذا المعنى؟</p><div class="pic">${t.p}</div><div class="big">${t.ar}</div>
      <div class="opts">${opts.map(o=>`<button class="opt en" data-v="${esc(o.en)}">${o.en}</button>`).join('')}</div>`
    :`<p class="ask">اقرأ الكلمة واختر معناها</p><div class="big en">${t.en}</div><button class="spk" id="s1">${ICON.spk} اسمع</button>
      <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o.en)}">${o.ar}</button>`).join('')}</div>`);
    if(!rev)$('#s1').onclick=()=>say(t.en);
    bindOpts(t.en,t.en);
  }
  if(k==='spell'){
    const w=t.en.toLowerCase(),abc='abcdefghijklmnopqrstuvwxyz';
    const extra=sh(abc.split('').filter(c=>!w.includes(c))).slice(0,w.length>7?2:3);
    const letters=sh([...w.split(''),...extra]);let fill=[];
    shell(`<p class="ask">اكتب الكلمة بالإنجليزية</p><div class="pic">${t.p}</div><div class="ar">${t.ar}</div><button class="spk" id="s1">${ICON.spk} اسمع</button>
    <div class="slots" id="sl"></div><div class="tiles" id="tl">${letters.map((c,i)=>`<button class="tile" data-i="${i}">${c}</button>`).join('')}</div>
    <div class="row"><button class="spk alt" id="clr">امسح</button>${R.test?'':'<button class="spk pk" id="hint">تلميح</button>'}</div>`);
    $('#s1').onclick=()=>say(t.en);
    const draw=()=>{$('#sl').innerHTML=w.split('').map((_,i)=>`<button class="slot ${fill[i]!=null?'f':''}" data-s="${i}">${fill[i]!=null?letters[fill[i]]:''}</button>`).join('');
      app.querySelectorAll('#tl .tile').forEach(b=>b.classList.toggle('used',fill.includes(+b.dataset.i)));
      app.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{const i=+s.dataset.s;if(fill[i]!=null){fill=fill.slice(0,i);draw()}})};
    app.querySelectorAll('#tl .tile').forEach(b=>b.onclick=()=>{if(fill.length>=w.length)return;fill.push(+b.dataset.i);say(letters[+b.dataset.i]);draw();
      if(fill.length===w.length){const got=fill.map(i=>letters[i]).join('');if(got===w){good(t.en)}else{bad();$('#sl').classList.add('wrong');setTimeout(()=>{fill=[];draw()},700)}}});
    $('#clr').onclick=()=>{fill=[];draw()};
    if($('#hint'))$('#hint').onclick=()=>{R.tried=true;let n=0;while(n<fill.length&&letters[fill[n]]===w[n])n++;fill=fill.slice(0,n);const idx=letters.findIndex((c,i)=>c===w[n]&&!fill.includes(i));if(idx>-1){fill.push(idx);draw()}};
    draw();
  }
  if(k==='say'){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    shell(`<p class="ask">اسمع الكلمة، ثم قلها بصوت عالٍ</p><div class="pic">${t.p}</div><div class="big en">${t.en}</div><div class="ar">${t.ar}</div>
    <div class="row"><button class="spk" id="s1">${ICON.spk} اسمع</button><button class="spk alt" id="s2">ببطء</button>${SR?`<button class="spk pk" id="mic">${ICON.mic} سجّل صوتي</button>`:''}</div>
    <p class="ask" style="margin-top:16px">هل قلتها مثل الصوت تماماً؟</p><div class="row"><button class="spk" id="yes" style="background:var(--ok);box-shadow:0 4px 0 #157a42">نعم، قلتها</button><button class="spk alt" id="again">سأعيد المحاولة</button></div>`);
    $('#s1').onclick=()=>say(t.en);$('#s2').onclick=()=>say(t.en,1);
    setTimeout(()=>say(t.en),300);
    $('#yes').onclick=()=>good(null);
    $('#again').onclick=()=>{R.tried=true;say(t.en,1);toast(false,'اسمع ببطء وقلها مرة أخرى')};
    if(SR)$('#mic').onclick=()=>{try{const r=new SR();r.lang='en-US';r.maxAlternatives=5;toast(true,'أنا أسمعك... تكلّم الآن');
      r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript.toLowerCase().trim());const tgt=t.en.toLowerCase();if(alts.some(a=>a.includes(tgt)||tgt.includes(a)&&a.length>2))good(null);else{bad();toast(false,'سمعت: '+alts[0]+' — حاول مرة أخرى')}};
      r.onerror=()=>toast(false,'الميكروفون غير متاح هنا — استخدم زر "نعم، قلتها"');r.start()}catch(e){toast(false,'الميكروفون غير متاح هنا — استخدم زر "نعم، قلتها"')}};
  }
  if(k==='build'){
    const words=t.split(' ');let order;do{order=sh(words.map((_,i)=>i))}while(words.length>1&&order.every((v,i)=>v===i));
    let pick=[];
    shell(`<p class="ask">اسمع الجملة ورتّب الكلمات بالترتيب الصحيح</p><button class="spk" id="s1">${ICON.spk} اسمع الجملة</button><button class="spk alt" id="s2">ببطء</button>
    <div class="line" id="ln"></div><div class="tiles" id="tl">${order.map(i=>`<button class="tile w" data-i="${i}">${esc(words[i])}</button>`).join('')}</div>
    <div class="row"><button class="spk pk" id="chk">تحقّق</button><button class="spk alt" id="clr">امسح</button></div>`);
    $('#s1').onclick=()=>say(t);$('#s2').onclick=()=>say(t,1);setTimeout(()=>say(t),300);
    const draw=()=>{$('#ln').innerHTML=pick.map((i,j)=>`<button class="tile w" data-j="${j}">${esc(words[i])}</button>`).join('');
      app.querySelectorAll('#tl .tile').forEach(b=>b.classList.toggle('used',pick.includes(+b.dataset.i)));
      app.querySelectorAll('#ln .tile').forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.j,1);draw()})};
    app.querySelectorAll('#tl .tile').forEach(b=>b.onclick=()=>{if(!pick.includes(+b.dataset.i)){pick.push(+b.dataset.i);draw()}});
    $('#clr').onclick=()=>{pick=[];draw()};
    $('#chk').onclick=()=>{if(pick.length<words.length){toast(false,'استخدم كل الكلمات');return}
      if(pick.map(i=>words[i]).join(' ')===t)good(t);else{bad();const l=$('#ln');l.classList.remove('wrong');void l.offsetWidth;l.classList.add('wrong')}};
    draw();
  }
  if(k==='gram'){
    const [q,...o]=t.split('|'),ans=o[0],full=q.replace('___',ans);
    shell(`<p class="ask">اختر الكلمة المناسبة للفراغ</p><div class="gq" id="gq">${esc(q).replace('___','<u>&nbsp;?&nbsp;</u>')}</div>
    <div class="opts one">${sh(o).map(x=>`<button class="opt en" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(R.lock)return;if(b.dataset.v===ans){R.lock=true;b.classList.add('right');$('#gq').innerHTML=esc(q).replace('___',`<u>${esc(ans)}</u>`);good(full.replace(/\(.*?\)/,''));setTimeout(()=>R.lock=false,1500)}else{b.classList.add('wrong');bad()}});
  }
}
function bindOpts(ans,speak){
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(R.lock)return;
    if(b.dataset.v===ans){R.lock=true;b.classList.add('right');good(speak);setTimeout(()=>R.lock=false,1300)}
    else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');bad()}});
}
function end(){
  if(R.test)return testEnd();
  const r=R.first/R.n,s=r>=.9?3:r>=.6?2:1;
  P[R.u.id]=P[R.u.id]||{};if(s>st(R.u.id,R.sk))P[R.u.id][R.sk]=s;save();
  app.querySelector('.play').innerHTML=`<div class="end">${MASCOT}<h3>${s===3?'أنت بطل!':s===2?'عمل رائع!':'أحسنت، واصل التدريب!'}</h3>${starRow(s)}
  <p>أجبت صحيحاً من أول محاولة في <b class="en">${R.first}</b> من <b class="en">${R.n}</b></p>${R.review?`<p class="ask">${weakN(R.u)?`نقاط ما زالت تحتاج تدريباً: <b class="en">${weakN(R.u)}</b> — ستظهر لك أكثر في المراجعة القادمة`:'ممتاز! لا توجد نقاط ضعف الآن في هذه الوحدة'}</p>`:''}
  <div class="row"><button class="spk" id="again">العب مرة أخرى</button><button class="spk alt" id="back">ألعاب الوحدة</button></div></div>`;
  beep(true);setTimeout(()=>say(s===3?'Excellent! You are a star!':'Good job!'),300);
  $('#again').onclick=()=>R.k==='readq'?readView(R.u,R.rx):start(R.u,R.k);$('#back').onclick=()=>R.k==='readq'&&R.u.reads.length>1?readList(R.u):unit(R.u);
}
function testEnd(){
  const pct=Math.round(R.first/R.n*100),s=pct>=90?3:pct>=70?2:pct>=50?1:0,id=R.u.id;
  P[id]=P[id]||{};if(s>st(id,'test'))P[id].test=s;if(pct>(P[id].testPct||0))P[id].testPct=pct;P[id].testLast=pct;save();
  const msg=pct>=90?'ممتاز! أتقنت الوحدة':pct>=70?'جيد جداً!':pct>=50?'جيد، راجع أخطاءك':'تحتاج مراجعة أكثر';
  app.querySelector('.play').innerHTML=`<div class="end"><div class="score" style="--p:${pct}"><span class="en">${pct}%</span></div><h3>${msg}</h3>${starRow(s)}
  <p><b class="en">${R.first}</b> إجابة صحيحة من <b class="en">${R.n}</b></p>
  ${R.wrongs.length?`<h4 style="margin:18px 0 8px">راجع أخطاءك</h4><div class="mist">${R.wrongs.map(w=>`<div><span>${bi(w.q)}</span><b class="en">${esc(w.a)}</b></div>`).join('')}</div><p class="ask">أضفنا هذه الأسئلة إلى المراجعة الذكية لتتدرّب عليها</p>`:''}
  <div class="row"><button class="spk" id="again">أعد الاختبار</button>${R.wrongs.length?'<button class="spk pk" id="rev">المراجعة الذكية</button>':''}<button class="spk alt" id="back">ألعاب الوحدة</button></div></div>`;
  beep(true);setTimeout(()=>say(pct>=70?'Great job!':'Keep practicing!'),300);
  $('#again').onclick=()=>start(R.u,'test');$('#back').onclick=()=>unit(R.u);if($('#rev'))$('#rev').onclick=()=>start(R.u,'review');
}
const bi=t=>esc(t).replace(/[A-Za-z][A-Za-z' ,…?!-]*[A-Za-z?…']|[A-Za-z]/g,m=>`<span class="en">${m}</span>`);
const hl=e=>esc(e).replace(/\[(.*?)\]/g,'<mark>$1</mark>');
const plain=e=>e.replace(/[\[\]]/g,'').replace(/←/g,', ').replace(/·/g,'. ').replace(/\//g,', ');
function blankQ(ask,q,opts,ans,extra){
  const has=q.includes('___');
  shell(`${extra||''}<p class="ask">${ask}</p><div class="gq" id="gq">${has?esc(q).replace('___','<u>&nbsp;?&nbsp;</u>'):esc(q)}</div>
  <button class="spk alt" id="sq" style="padding:6px 14px;min-height:40px">${ICON.spk} اسمع السؤال</button>
  <div class="opts one">${sh(opts).map(x=>`<button class="opt en" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`);
  $('#sq').onclick=()=>say(q.replace('___','blank'));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(R.lock)return;
    if(b.dataset.v===ans){R.lock=true;b.classList.add('right');if(has)$('#gq').innerHTML=esc(q).replace('___',`<u>${esc(ans)}</u>`);good(has?q.replace('___',ans):ans);setTimeout(()=>R.lock=false,1600)}
    else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');bad()}});
}
function lessonRound(t){
  if(t.type==='rule'){
    const r=t.r,heard=new Set();
    shell(`<div class="rule"><span class="tag">القاعدة ${t.ri+1} من ${R.u.rules.length}</span><h3>${bi(r.t)}</h3>
    <p class="exp">${bi(r.ar)}</p>
    <p class="ask">اكتشف الأمثلة: المس كل مثال لتسمعه، وانتبه للكلمات الملوّنة</p>
    <div class="exs">${r.ex.map((e,i)=>`<button class="ex" data-i="${i}"><span class="pl">${ICON.play}</span><span class="en">${hl(e)}</span></button>`).join('')}</div>
    <div class="tip"><b>تذكّر:</b> <span>${bi(r.tip)}</span></div>
    <p class="ask" id="cnt">سمعت <span class="en">0/${r.ex.length}</span> من الأمثلة</p>
    <button class="spk pk" id="go" disabled style="opacity:.45">فهمت! هيا نتدرّب</button></div>`);
    app.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{say(plain(r.ex[+b.dataset.i]));heard.add(b.dataset.i);b.classList.add('done');
      $('#cnt').innerHTML=`سمعت <span class="en">${heard.size}/${r.ex.length}</span> من الأمثلة`;
      if(heard.size===r.ex.length){const g=$('#go');g.disabled=false;g.style.opacity=1;g.classList.add('pulse');beep(true)}});
    $('#go').onclick=()=>next();
    return;
  }
  const [q,...o]=t.s.split('|');
  if(t.type==='chk')return blankQ('تدرّب: '+t.r.t,q,o,o[0]);
  const rd=R.u.reads[t.rx??R.rx];
  blankQ('اختر الإجابة الصحيحة من القصة',q,o,o[0],`<details class="peek"><summary>اقرأ القصة مرة أخرى</summary><p class="en">${esc(rd.text)}</p></details>`);
}
const ALLW={};U.forEach(u=>u.W.forEach(w=>{if(!/\s/.test(w.en))ALLW[w.en.toLowerCase()]=w.ar}));
function lookup(w){
  w=w.toLowerCase().replace(/[^a-z0-9'-]/g,'').replace(/^'+|'+$/g,'');
  const c=[w,w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ed$/,''),w.replace(/d$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ied$/,'y')];
  for(const x of c){if(DICT[x])return DICT[x];if(ALLW[x])return ALLW[x]}
  return null;
}
function readView(u,x){
  const rd=u.reads[x],S=rd.text.match(/[^.!?]+[.!?]+["”]?\s*/g).map(s=>s.trim());
  let stop=true;
  app.innerHTML=`<div class="wrap"><div class="sub"><button class="back" aria-label="رجوع">${ICON.back}</button><div><h2>درس القراءة</h2><small style="color:var(--soft)">${u.ar} · ${u.reads.length>1?`النص ${x+1} من ${u.reads.length}`:'قراءة وفهم'}</small></div></div>
  <div class="play"><div class="hero in">${scene(rd.s,rd.a)}</div><div class="big en" style="margin-bottom:0">${esc(rd.t)}</div><div class="ar">${esc(rd.ar)}</div>
  <div class="row"><button class="spk" id="all">${ICON.spk} اقرأ لي القصة</button><button class="spk alt" id="stop">توقّف</button></div>
  <div class="gloss" id="gl">المس أي كلمة لتسمعها وتعرف معناها</div>
  <div class="story">${S.map((s,i)=>`<p class="sn" data-i="${i}"><button class="sp" data-i="${i}" aria-label="اسمع الجملة">${ICON.play}</button>${s.split(/\s+/).map(w=>`<span class="wd">${esc(w)}</span>`).join(' ')}</p>`).join('')}</div>
  <p class="ask">بعد أن تقرأ القصة وتفهمها، أجب عن الأسئلة لتجمع النجوم</p>
  <button class="spk pk" id="qs">أجب عن الأسئلة ${starRow(st(u.id,'read'+x))}</button></div></div>`;
  const mark=i=>app.querySelectorAll('.sn').forEach(p=>p.classList.toggle('on',+p.dataset.i===i));
  const sayCb=(t,cb)=>{try{speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(t);m.lang='en-US';if(voice)m.voice=voice;m.rate=.62;let done=false;const f=()=>{if(!done){done=true;cb&&cb()}};m.onend=f;setTimeout(f,Math.max(2500,t.length*120));speechSynthesis.speak(m)}catch(e){cb&&setTimeout(cb,1500)}};
  const run=i=>{if(stop||i>=S.length){stop=true;mark(-1);return}mark(i);app.querySelector(`.sn[data-i="${i}"]`).scrollIntoView({block:'nearest',behavior:'smooth'});sayCb(S[i],()=>setTimeout(()=>run(i+1),350))};
  $('#all').onclick=()=>{stop=false;run(0)};
  $('#stop').onclick=()=>{stop=true;mark(-1);try{speechSynthesis.cancel()}catch(e){}};
  app.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{stop=true;const i=+b.dataset.i;mark(i);say(S[i])});
  app.querySelectorAll('.wd').forEach(s=>s.onclick=()=>{stop=true;const w=s.textContent.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,'');const m=lookup(w);
    app.querySelectorAll('.wd.sel').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');
    $('#gl').innerHTML=`<b class="en">${esc(w)}</b>${m?` — <span>${esc(m)}</span>`:''}`;$('#gl').classList.add('has');say(w,1)});
  app.querySelector('.back').onclick=()=>{stop=true;try{speechSynthesis.cancel()}catch(e){}u.reads.length>1?readList(u):unit(u)};
  $('#qs').onclick=()=>{stop=true;try{speechSynthesis.cancel()}catch(e){}start(u,'readq',x)};
  scrollTo(0,0);
}
function learn(u){
  R={u,k:'learn',items:u.W,i:0};
  app.innerHTML=`<div class="wrap"><div class="sub"><button class="back" aria-label="رجوع">${ICON.back}</button><div><h2>تعلّم الكلمات</h2><small style="color:var(--soft)">${u.ar} · <span class="en">${u.W.length}</span> كلمة — اضغط على البطاقة لتسمعها</small></div></div>
  <div class="play"><div class="flash" id="fl">${u.W.map((w,i)=>`<button class="fc" data-i="${i}"><div class="pic">${w.p}</div><div class="w">${w.en}</div><div class="a">${w.ar}</div></button>`).join('')}</div>
  <div class="row"><button class="spk alt" id="prev">السابقة</button><button class="spk" id="nx">التالية</button></div>
  <h3 style="margin:22px 0 4px">جمل الوحدة</h3><p class="ask">اضغط على الجملة لتسمعها واقرأها معها</p>
  <div class="opts one">${u.sent.map(s=>`<button class="opt en snt" style="font-size:19px">${esc(s)}</button>`).join('')}</div></div></div>`;
  app.querySelector('.back').onclick=()=>unit(u);
  const fl=$('#fl'),cards=[...fl.children];let cur=0;
  const go=d=>{cur=Math.max(0,Math.min(cards.length-1,cur+d));cards[cur].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});say(u.W[cur].en)};
  cards.forEach(c=>c.onclick=()=>{cur=+c.dataset.i;say(u.W[cur].en)});
  $('#nx').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
  app.querySelectorAll('.snt').forEach(b=>b.onclick=()=>say(b.textContent));
  scrollTo(0,0);
}
home();
}
</script>
</body>
</html>
